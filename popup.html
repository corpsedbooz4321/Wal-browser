<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wal Browser - Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Wal Browser</h1>
      <p class="subtitle">Pywall Theme Manager</p>
    </div>

    <div class="<section">
      <h2>Theme Settings</h2>
      <div class="<Settings-item">
        <label for="autoUpdate">
          <input type="checkbox" id="autoUpdate" checked>
          auto-update from pywal
        </label>
        <span class="info">Update theme when pywal changes colors.
        </span>
        </<div>
        <div class="Settings-item">
          <label for="updateInterval">
            Update Interval (seconds):
          </label>
          <input type="number" id="updateInterval" min="2" max="60" value="5" </div>
        </div>

        <div class="section">
          <h2>Current Colors</h2>
          <div id="colorPallete" class="color-pallete">
            <div class="loading">loading colors....</div>
          </div>

        </div>

        <div class="section">
          <h2>Actions</h2>
          <button id="refreshBtn" class="button button-primary">Refresh Colors</button>
          <button id="resetBtn" class="button button secondary">Reset to Defalut</button>
        </div>

        <div class="section">
          <h2>About?</h2>
          <p class="about-text">
            An extention that dynamically theme you chormium-basd Browser with using pywal colors.
            changes are are in realtime!!
          </p>

          <p class="version"> version 0.1.0</p>
        </div>
      </div>
      <script src="popup.js"></script>
</body>

</html>
